    <link rel="stylesheet" href="../../../css/style.css">
    <style>
        .dim-list{display:flex;flex-direction:column;gap:0;max-width:640px;margin:0 auto;border:1px solid var(--border-color,rgba(255,255,255,0.1));border-radius:14px;overflow:hidden}
        .dim-item{display:flex;align-items:center;gap:18px;padding:16px 22px;text-decoration:none;background:transparent;border-bottom:1px solid var(--border-color,rgba(255,255,255,0.07));transition:background 0.18s}
        .dim-item:last-child{border-bottom:none}
        .dim-item:hover{background:rgba(var(--color-engineering-rgb,200,160,60),0.06)}
        .dim-item:hover .dim-arrow{transform:translateX(4px);opacity:1}
        .dim-item.disabled{pointer-events:none;opacity:0.45}
        .dim-icon{width:40px;height:40px;border-radius:10px;background:rgba(var(--color-engineering-rgb,200,160,60),0.08);border:1px solid rgba(var(--color-engineering-rgb,200,160,60),0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}

        .dim-text{flex:1;display:flex;flex-direction:column;gap:2px}
        .dim-title{font-size:0.9rem;font-weight:700;color:var(--text-primary);line-height:1.2}
        .dim-desc{font-size:0.78rem;color:var(--text-secondary);line-height:1.4}
        .dim-arrow{color:var(--color-engineering);opacity:0.4;flex-shrink:0;transition:transform 0.18s,opacity 0.18s}
        .dim-badge{font-size:0.65rem;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:rgba(var(--color-engineering-rgb,200,160,60),0.1);border:1px solid rgba(var(--color-engineering-rgb,200,160,60),0.25);color:var(--color-engineering);flex-shrink:0}
        .dim-separator{padding:10px 22px 6px;font-size:0.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);background:rgba(var(--color-engineering-rgb,200,160,60),0.03);border-bottom:1px solid var(--border-color,rgba(255,255,255,0.05));user-select:none}
